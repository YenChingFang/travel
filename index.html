<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行記錄 · Lillian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400&family=Noto+Serif+TC:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  --color-ivoire:   #F5F0E8;
  --color-gold:     #C9A96E;
  --color-gold-dim: rgba(201,169,110,0.25);
  --color-brume:    #9E9B93;
  --color-charbon:  #2C2C2A;
  --color-surface:  #FFFFFF;
  --color-border:   rgba(44,44,42,0.09);

  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-zh:      'Noto Serif TC', serif;
  --font-ui:      'Jost', 'Inter', sans-serif;

  --shadow-sm: 0 1px 6px rgba(44,44,42,0.06);
  --shadow-md: 0 6px 24px rgba(44,44,42,0.10);

  --transition-fast: 150ms ease;
  --transition-base: 300ms ease;
  --transition-slow: 600ms ease;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--color-ivoire);
  color: var(--color-charbon);
  font-family: var(--font-ui);
  font-weight: 300;
  font-size: 13px;
  line-height: 1.6;
  min-height: 100vh;
}

/* ── HEADER ── */
header {
  max-width: 1280px;
  margin: 0 auto;
  padding: 48px 64px 40px;
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
}
.logo {
  font-family: var(--font-display);
  font-size: 30px;
  font-weight: 300;
  letter-spacing: 0.22em;
  color: var(--color-charbon);
  display: block;
  line-height: 1;
  margin-bottom: 8px;
}
.logo-sub {
  font-family: var(--font-ui);
  font-size: 10px;
  font-weight: 300;
  letter-spacing: 0.45em;
  text-transform: uppercase;
  color: var(--color-brume);
}
.header-right {
  font-family: var(--font-ui);
  font-size: 10px;
  font-weight: 300;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--color-brume);
  text-align: right;
}
.header-right .count {
  display: block;
  font-family: var(--font-display);
  font-size: 40px;
  font-weight: 300;
  letter-spacing: 0.05em;
  color: var(--color-gold);
  line-height: 1;
  margin-bottom: 4px;
}

/* ── MAIN ── */
main {
  max-width: 1280px;
  margin: 0 auto;
  padding: 52px 64px 100px;
}

/* ── SECTION LABEL ── */
.section-label {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 36px;
}
.section-label span {
  font-size: 10px;
  font-weight: 300;
  letter-spacing: 0.45em;
  text-transform: uppercase;
  color: var(--color-brume);
  white-space: nowrap;
}
.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--color-gold-dim);
}

/* ── GRID ── */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 2px;
}

/* ── TRIP CARD ── */
.card {
  position: relative;
  display: block;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  text-decoration: none;
  color: inherit;
  overflow: hidden;
  transition: box-shadow var(--transition-base), transform var(--transition-base);
}
.card:not(.placeholder):hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-3px);
  z-index: 1;
}

/* Cover photo */
.card-cover {
  width: 100%;
  height: 180px;
  object-fit: cover;
  display: block;
  filter: saturate(0.82) brightness(1.04);
  transition: filter var(--transition-slow), transform var(--transition-slow);
}
.card:not(.placeholder):hover .card-cover {
  filter: saturate(0.9) brightness(1.06);
  transform: scale(1.03);
}
.card-cover-wrap {
  overflow: hidden;
  height: 180px;
  position: relative;
}
.card-flag {
  position: absolute;
  bottom: 12px; right: 14px;
  font-size: 22px;
  line-height: 1;
  filter: drop-shadow(0 1px 3px rgba(0,0,0,0.3));
}

/* Card body */
.card-body { padding: 28px 28px 26px; }

.card-index {
  font-size: 10px;
  font-weight: 300;
  letter-spacing: 0.4em;
  color: var(--color-gold);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.card-index::after {
  content: '';
  flex: 0 0 24px;
  height: 1px;
  background: var(--color-gold-dim);
}

.card-city {
  font-family: var(--font-display);
  font-size: 38px;
  font-weight: 300;
  line-height: 1;
  letter-spacing: 0.04em;
  color: var(--color-charbon);
  margin-bottom: 4px;
}
.card-city-zh {
  font-family: var(--font-zh);
  font-size: 12px;
  font-weight: 300;
  letter-spacing: 0.22em;
  color: var(--color-brume);
  margin-bottom: 24px;
}

.card-meta { display: flex; align-items: baseline; justify-content: space-between; }
.card-year {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 300;
  letter-spacing: 0.1em;
  color: var(--color-charbon);
}
.card-currency {
  font-size: 10px;
  font-weight: 300;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--color-brume);
}

.card-arrow {
  position: absolute;
  bottom: 24px; right: 28px;
  font-family: var(--font-display);
  font-size: 18px;
  color: var(--color-gold);
  opacity: 0;
  transform: translate(-4px, 4px);
  transition: opacity var(--transition-base), transform var(--transition-base);
}
.card:not(.placeholder):hover .card-arrow { opacity: 1; transform: translate(0,0); }

/* ── PLACEHOLDER ── */
.card.placeholder { cursor: default; }
.card.placeholder .card-cover { filter: saturate(0.3) brightness(1.1); }
.card.placeholder .card-city,
.card.placeholder .card-city-zh,
.card.placeholder .card-year,
.card.placeholder .card-currency,
.card.placeholder .card-index { opacity: 0.3; }
.placeholder-badge {
  position: absolute;
  top: 10px; right: 10px;
  font-size: 9px;
  font-weight: 300;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: rgba(44,44,42,0.5);
  background: rgba(245,240,232,0.88);
  padding: 3px 8px;
  border-radius: 2px;
  backdrop-filter: blur(4px);
}

/* ── FEATURED (wider card for newest trip) ── */
.card.featured {
  grid-column: span 2;
}
.card.featured .card-cover { height: 260px; }
.card.featured .card-cover-wrap { height: 260px; }
.card.featured .card-city { font-size: 52px; }

/* ── ORNAMENT ── */
.ornament {
  text-align: center;
  padding: 52px 0 0;
  font-family: var(--font-display);
  font-size: 14px;
  color: var(--color-gold-dim);
  letter-spacing: 0.5em;
}

/* ── FOOTER ── */
footer {
  max-width: 1280px;
  margin: 0 auto;
  padding: 28px 64px;
  border-top: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.footer-logo {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 300;
  letter-spacing: 0.3em;
  color: var(--color-brume);
}
.footer-copy {
  font-size: 10px;
  font-weight: 300;
  letter-spacing: 0.22em;
  color: var(--color-brume);
  opacity: 0.55;
}

/* ── RESPONSIVE ── */
@media (max-width: 1024px) {
  .grid { grid-template-columns: repeat(2, 1fr); }
  .card.featured { grid-column: span 2; }
}
@media (max-width: 680px) {
  header, main, footer { padding-left: 20px; padding-right: 20px; }
  header { flex-direction: column; align-items: flex-start; }
  .grid { grid-template-columns: 1fr; }
  .card.featured { grid-column: span 1; }
  .card.featured .card-cover { height: 200px; }
  .card.featured .card-cover-wrap { height: 200px; }
  .card.featured .card-city { font-size: 42px; }
}
</style>
</head>
<body>

<header>
  <div>
    <span class="logo">旅行記錄</span>
    <span class="logo-sub">Travel Archive &nbsp;·&nbsp; Lillian</span>
  </div>
  <div class="header-right">
    <span class="count">5</span>
    Voyages
  </div>
</header>

<main>
  <div class="section-label"><span>Trips / 旅程列表</span></div>

  <div class="grid">

    <!-- 01 東京 2026（最新・featured） -->
    <a class="card featured" href="./tokyo-2026/">
      <div class="card-cover-wrap">
        <img class="card-cover" src="https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?w=900&q=80&fit=crop" alt="Tokyo" loading="lazy">
        <span class="card-flag">🇯🇵</span>
      </div>
      <div class="card-body">
        <div class="card-index">01</div>
        <div class="card-city">Tokyo</div>
        <div class="card-city-zh">日本 · 東京・銀座・麻布台</div>
        <div class="card-meta">
          <div class="card-year">2026 · 6月</div>
          <div class="card-currency">JPY · 5天4夜</div>
        </div>
      </div>
      <div class="card-arrow">↗</div>
    </a>

    <!-- 02 巴黎 2026 -->
    <a class="card" href="./paris-2026/">
      <div class="card-cover-wrap">
        <img class="card-cover" src="https://images.unsplash.com/photo-1499856871958-5b9627545d1a?w=600&q=80&fit=crop" alt="Paris" loading="lazy">
        <span class="card-flag">🇫🇷</span>
      </div>
      <div class="card-body">
        <div class="card-index">02</div>
        <div class="card-city">Paris</div>
        <div class="card-city-zh">法國 · 巴黎</div>
        <div class="card-meta">
          <div class="card-year">2026</div>
          <div class="card-currency">EUR · 待出發</div>
        </div>
      </div>
      <div class="card-arrow">↗</div>
    </a>

    <!-- 03 福岡 2025 -->
    <a class="card placeholder" href="./fukuoka-2025/">
      <div class="placeholder-badge">即將上線</div>
      <div class="card-cover-wrap">
        <img class="card-cover" src="https://images.unsplash.com/photo-1528360983277-13d401cdc186?w=600&q=80&fit=crop" alt="Fukuoka" loading="lazy">
        <span class="card-flag">🇯🇵</span>
      </div>
      <div class="card-body">
        <div class="card-index">03</div>
        <div class="card-city">Fukuoka</div>
        <div class="card-city-zh">日本 · 福岡</div>
        <div class="card-meta">
          <div class="card-year">2025</div>
          <div class="card-currency">JPY</div>
        </div>
      </div>
    </a>

    <!-- 04 港澳 2025 -->
    <a class="card placeholder" href="./hk-2025/">
      <div class="placeholder-badge">即將上線</div>
      <div class="card-cover-wrap">
        <img class="card-cover" src="https://images.unsplash.com/photo-1536599424071-0b215a388ba7?w=600&q=80&fit=crop" alt="Hong Kong" loading="lazy">
        <span class="card-flag">🇭🇰</span>
      </div>
      <div class="card-body">
        <div class="card-index">04</div>
        <div class="card-city">HK · Macau</div>
        <div class="card-city-zh">香港 · 澳門</div>
        <div class="card-meta">
          <div class="card-year">2025</div>
          <div class="card-currency">HKD · MOP</div>
        </div>
      </div>
    </a>

    <!-- 05 日本關東 2024 -->
    <a class="card placeholder" href="./japan-2024/">
      <div class="placeholder-badge">即將上線</div>
      <div class="card-cover-wrap">
        <img class="card-cover" src="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=600&q=80&fit=crop" alt="Japan Kanto" loading="lazy">
        <span class="card-flag">🇯🇵</span>
      </div>
      <div class="card-body">
        <div class="card-index">05</div>
        <div class="card-city">Kantō</div>
        <div class="card-city-zh">日本 · 關東</div>
        <div class="card-meta">
          <div class="card-year">2024</div>
          <div class="card-currency">JPY</div>
        </div>
      </div>
    </a>

  </div>

  <div class="ornament">· · ·</div>
</main>

<footer>
  <span class="footer-logo">Lys</span>
  <span class="footer-copy">私人旅行記錄 &nbsp;·&nbsp; All Rights Reserved</span>
</footer>

</body>
</html>
