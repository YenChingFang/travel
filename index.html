<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行記錄 · Lillian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400&family=Noto+Serif+TC:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  --color-ivoire:   #F5F0E8;
  --color-gold:     #C9A96E;
  --color-gold-dim: rgba(201,169,110,0.30);
  --color-brume:    #9E9B93;
  --color-charbon:  #2C2C2A;
  --color-surface:  #FFFFFF;
  --color-border:   rgba(44,44,42,0.10);

  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-zh:      'Noto Serif TC', serif;
  --font-ui:      'Jost', 'Inter', sans-serif;

  --shadow-sm: 0 1px 4px rgba(44,44,42,0.06);
  --shadow-md: 0 4px 16px rgba(44,44,42,0.08);

  --transition-fast: 150ms ease;
  --transition-base: 300ms ease;
  --transition-slow: 600ms ease;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--color-ivoire);
  color: var(--color-charbon);
  font-family: var(--font-ui);
  font-weight: 300;
  font-size: 13px;
  line-height: 1.6;
  min-height: 100vh;
}

/* ── HEADER ── */
header {
  max-width: 1200px;
  margin: 0 auto;
  padding: 48px 64px 40px;
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
}

.logo-wrap {}
.logo {
  font-family: var(--font-display);
  font-size: 32px;
  font-weight: 300;
  letter-spacing: 0.25em;
  color: var(--color-charbon);
  display: block;
  line-height: 1;
  margin-bottom: 8px;
}
.logo-sub {
  font-family: var(--font-ui);
  font-size: 10px;
  font-weight: 300;
  letter-spacing: 0.45em;
  text-transform: uppercase;
  color: var(--color-brume);
}

.header-right {
  font-family: var(--font-ui);
  font-size: 10px;
  font-weight: 300;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--color-brume);
  text-align: right;
}
.header-right .count {
  display: block;
  font-family: var(--font-display);
  font-size: 36px;
  font-weight: 300;
  letter-spacing: 0.05em;
  color: var(--color-gold);
  line-height: 1;
  margin-bottom: 4px;
}

/* ── MAIN ── */
main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 56px 64px 100px;
}

/* ── SECTION LABEL ── */
.section-label {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 40px;
}
.section-label span {
  font-family: var(--font-ui);
  font-size: 10px;
  font-weight: 300;
  letter-spacing: 0.45em;
  text-transform: uppercase;
  color: var(--color-brume);
  white-space: nowrap;
}
.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--color-gold-dim);
}

/* ── GRID ── */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 2px;
}

/* ── TRIP CARD ── */
.card {
  position: relative;
  display: block;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  padding: 44px 40px 40px;
  text-decoration: none;
  color: inherit;
  overflow: hidden;
  transition: box-shadow var(--transition-base), transform var(--transition-base);
}
.card:not(.placeholder):hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}

.card::after {
  content: '';
  position: absolute;
  bottom: 0; left: 40px; right: 40px;
  height: 1px;
  background: var(--color-gold-dim);
  transform: scaleX(0);
  transition: transform var(--transition-slow);
  transform-origin: left;
}
.card:not(.placeholder):hover::after { transform: scaleX(1); }

.card-index {
  font-family: var(--font-ui);
  font-size: 10px;
  font-weight: 300;
  letter-spacing: 0.4em;
  color: var(--color-gold);
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.card-index::after {
  content: '';
  flex: 0 0 32px;
  height: 1px;
  background: var(--color-gold-dim);
}

.card-city {
  font-family: var(--font-display);
  font-size: 52px;
  font-weight: 300;
  line-height: 1;
  letter-spacing: 0.04em;
  color: var(--color-charbon);
  margin-bottom: 4px;
}
.card-city-zh {
  font-family: var(--font-zh);
  font-size: 14px;
  font-weight: 300;
  letter-spacing: 0.25em;
  color: var(--color-brume);
  margin-bottom: 32px;
}

.card-meta {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.card-year {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 300;
  letter-spacing: 0.1em;
  color: var(--color-charbon);
}
.card-currency {
  font-family: var(--font-ui);
  font-size: 10px;
  font-weight: 300;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--color-brume);
}

.card-arrow {
  position: absolute;
  bottom: 36px; right: 40px;
  font-family: var(--font-display);
  font-size: 20px;
  color: var(--color-gold);
  opacity: 0;
  transform: translate(-4px, 4px);
  transition: opacity var(--transition-base), transform var(--transition-base);
}
.card:not(.placeholder):hover .card-arrow {
  opacity: 1;
  transform: translate(0, 0);
}

/* ── PLACEHOLDER ── */
.card.placeholder {
  background: rgba(245,240,232,0.5);
}
.card.placeholder .card-city,
.card.placeholder .card-city-zh,
.card.placeholder .card-year,
.card.placeholder .card-currency,
.card.placeholder .card-index {
  opacity: 0.3;
}
.placeholder-badge {
  position: absolute;
  top: 20px; right: 20px;
  font-family: var(--font-ui);
  font-size: 9px;
  font-weight: 300;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--color-brume);
  border: 1px solid var(--color-border);
  padding: 3px 8px;
  border-radius: 2px;
  opacity: 0.6;
}

/* ── ORNAMENT ── */
.ornament {
  text-align: center;
  padding: 48px 0 0;
  font-family: var(--font-display);
  font-size: 14px;
  color: var(--color-gold-dim);
  letter-spacing: 0.5em;
}

/* ── FOOTER ── */
footer {
  max-width: 1200px;
  margin: 0 auto;
  padding: 28px 64px;
  border-top: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.footer-logo {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 300;
  letter-spacing: 0.3em;
  color: var(--color-brume);
}
.footer-copy {
  font-family: var(--font-ui);
  font-size: 10px;
  font-weight: 300;
  letter-spacing: 0.25em;
  color: var(--color-brume);
  opacity: 0.6;
}

/* ── RESPONSIVE ── */
@media (max-width: 900px) {
  header, main, footer { padding-left: 32px; padding-right: 32px; }
  .grid { grid-template-columns: 1fr; }
  .card-city { font-size: 42px; }
}
@media (max-width: 600px) {
  header, main, footer { padding-left: 20px; padding-right: 20px; }
  header { flex-direction: column; align-items: flex-start; gap: 16px; }
  .header-right { text-align: left; }
}
</style>
</head>
<body>

<header>
  <div class="logo-wrap">
    <span class="logo">旅行記錄</span>
    <span class="logo-sub">Travel Archive &nbsp;·&nbsp; Lillian</span>
  </div>
  <div class="header-right">
    <span class="count">4</span>
    Voyages
  </div>
</header>

<main>
  <div class="section-label"><span>Trips / 旅程列表</span></div>

  <div class="grid">

    <!-- 巴黎 2026 -->
    <a class="card" href="./paris-2026/">
      <div class="card-index">01</div>
      <div class="card-city">Paris</div>
      <div class="card-city-zh">法國 · France</div>
      <div class="card-meta">
        <div class="card-year">2026</div>
        <div class="card-currency">EUR · 歐元</div>
      </div>
      <div class="card-arrow">↗</div>
    </a>

    <!-- 福岡 2025 -->
    <a class="card placeholder" href="./fukuoka-2025/">
      <div class="placeholder-badge">即將上線</div>
      <div class="card-index">02</div>
      <div class="card-city">Fukuoka</div>
      <div class="card-city-zh">日本 · 福岡</div>
      <div class="card-meta">
        <div class="card-year">2025</div>
        <div class="card-currency">JPY · 日圓</div>
      </div>
    </a>

    <!-- 港澳 2025 -->
    <a class="card placeholder" href="./hk-2025/">
      <div class="placeholder-badge">即將上線</div>
      <div class="card-index">03</div>
      <div class="card-city">HK · Macau</div>
      <div class="card-city-zh">香港 · 澳門</div>
      <div class="card-meta">
        <div class="card-year">2025</div>
        <div class="card-currency">HKD · MOP</div>
      </div>
    </a>

    <!-- 日本關東 2024 -->
    <a class="card placeholder" href="./japan-2024/">
      <div class="placeholder-badge">即將上線</div>
      <div class="card-index">04</div>
      <div class="card-city">Kantō</div>
      <div class="card-city-zh">日本 · 關東</div>
      <div class="card-meta">
        <div class="card-year">2024</div>
        <div class="card-currency">JPY · 日圓</div>
      </div>
    </a>

  </div>

  <div class="ornament">· · ·</div>
</main>

<footer>
  <span class="footer-logo">Lys</span>
  <span class="footer-copy">私人旅行記錄 &nbsp;·&nbsp; All Rights Reserved</span>
</footer>

</body>
</html>
